<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photomaton - Récepteur WebRTC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .video-container {
      position: relative; width: 100vw; height: 100vh; display: flex;
      align-items: center; justify-content: center; background: #000;
    }
    #remote-video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .hud-overlay {
      position: absolute; top: 20px; left: 20px; right: 20px; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      pointer-events: none; transition: opacity 0.8s ease;
    }
    .hud-overlay.faded { opacity: 0; }
    .hud-badge, .hud-btn {
      display: flex; align-items: center; gap: 9px; padding: 8px 14px;
      border: 1px solid rgba(255,255,255,.12); border-radius: 9px;
      background: rgba(18,20,24,.75); backdrop-filter: blur(12px);
      color: #fff; font-size: 12px;
    }
    .hud-btn { pointer-events: auto; cursor: pointer; }
    .hud-btn:hover { background: rgba(255,255,255,.15); }
    .status-dot {
      width: 9px; height: 9px; border-radius: 50%; background: #f59e0b;
      box-shadow: 0 0 12px #f59e0b;
    }
    .status-dot.connected { background: #10b981; box-shadow: 0 0 14px #10b981; }
    .status-dot.disconnected { background: #ef4444; box-shadow: 0 0 12px #ef4444; }
    .waiting-screen {
      position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; background: #08090b;
      transition: opacity .6s ease;
    }
    .waiting-screen.hidden { opacity: 0; pointer-events: none; }
    .waiting-title { font-size: 20px; font-weight: 600; }
    .waiting-subtitle {
      max-width: 430px; color: rgba(255,255,255,.5); font-size: 14px;
      line-height: 1.5; text-align: center;
    }
    .spinner {
      width: 38px; height: 38px; border: 3px solid rgba(255,255,255,.1);
      border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="video-container">
    <video id="remote-video" autoplay playsinline muted></video>
    <div class="hud-overlay" id="hud">
      <div class="hud-badge">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Connexion au Photomaton…</span>
      </div>
      <button class="hud-btn" id="btn-audio" type="button" aria-pressed="false">🔇 Activer le son</button>
      <button class="hud-btn" id="btn-fullscreen" type="button">⛶ Plein écran</button>
    </div>
    <div class="waiting-screen" id="waiting-screen">
      <div class="spinner"></div>
      <div class="waiting-title">En attente du flux Photomaton…</div>
      <div class="waiting-subtitle">Ce récepteur affiche le flux WebRTC. Activez le son pour entendre les presets. Aucune capture visiteur n’est enregistrée.</div>
    </div>
  </div>

  <script type="module">
    const videoEl = document.getElementById('remote-video');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const hud = document.getElementById('hud');
    const waitingScreen = document.getElementById('waiting-screen');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const btnAudio = document.getElementById('btn-audio');
    btnAudio.addEventListener('click', () => {
      videoEl.muted = !videoEl.muted;
      btnAudio.textContent = videoEl.muted ? '🔇 Activer le son' : '🔊 Son activé';
      btnAudio.setAttribute('aria-pressed', String(!videoEl.muted));
      videoEl.play().catch(() => {});
      showHUDTemporarily();
    });

    let pc = null;
    let ws = null;
    let hudTimeout = null;
    const viewerId = `viewer_${Math.floor(Math.random() * 100000)}`;
    const iceServers = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ];

    function showHUDTemporarily() {
      hud.classList.remove('faded');
      if (hudTimeout) clearTimeout(hudTimeout);
      hudTimeout = setTimeout(() => {
        if (pc?.connectionState === 'connected') hud.classList.add('faded');
      }, 4000);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen().catch(() => {});
    }

    document.addEventListener('mousemove', showHUDTemporarily);
    document.addEventListener('keydown', event => {
      if (event.key.toLowerCase() === 'f') toggleFullscreen();
    });
    btnFullscreen.addEventListener('click', toggleFullscreen);

    function connectSignaling() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      statusDot.className = 'status-dot';
      statusText.textContent = 'Connexion au serveur…';
      ws = new WebSocket(`${protocol}//${window.location.host}/webrtc-signaling`);
      ws.onopen = () => {
        statusText.textContent = 'En attente de l’émetteur…';
        ws.send(JSON.stringify({ type: 'register', role: 'viewer', viewerId }));
      };
      ws.onmessage = async event => {
        try { await handleSignalingMessage(JSON.parse(event.data)); }
        catch (error) { console.error('[WebRTC Receiver]', error); }
      };
      ws.onclose = () => {
        statusDot.className = 'status-dot disconnected';
        statusText.textContent = 'Déconnecté. Nouvelle tentative…';
        waitingScreen.classList.remove('hidden');
        setTimeout(connectSignaling, 2000);
      };
      ws.onerror = () => {};
    }

    async function handleSignalingMessage(message) {
      if (message.type === 'offer') await handleOffer(message);
      else if (message.type === 'ice-candidate' && pc && message.candidate) {
        try { await pc.addIceCandidate(new RTCIceCandidate(message.candidate)); } catch (error) {}
      } else if (message.type === 'broadcaster-ready') {
        statusText.textContent = 'Émetteur détecté. Négociation…';
      } else if (message.type === 'broadcaster-disconnected') {
        statusDot.className = 'status-dot disconnected';
        statusText.textContent = 'Émetteur déconnecté';
        waitingScreen.classList.remove('hidden');
      }
    }

    async function handleOffer(message) {
      if (pc) { try { pc.close(); } catch (error) {} }
      pc = new RTCPeerConnection({ iceServers });
      pc.ontrack = event => {
        if (event.streams?.[0]) videoEl.srcObject = event.streams[0];
        else {
          const stream = new MediaStream();
          stream.addTrack(event.track);
          videoEl.srcObject = stream;
        }
        videoEl.play().catch(() => {});
        waitingScreen.classList.add('hidden');
        statusDot.className = 'status-dot connected';
        statusText.textContent = 'FLUX WEBRTC ACTIF';
        showHUDTemporarily();
      };
      pc.onicecandidate = event => {
        if (event.candidate && ws?.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'ice-candidate', role: 'viewer', viewerId, candidate: event.candidate }));
        }
      };
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'connected') {
          statusDot.className = 'status-dot connected';
          statusText.textContent = 'FLUX WEBRTC DIRECT // CONNECTÉ';
          waitingScreen.classList.add('hidden');
        } else if (['disconnected', 'failed'].includes(pc.connectionState)) {
          statusDot.className = 'status-dot disconnected';
          statusText.textContent = 'Flux interrompu. En attente…';
          waitingScreen.classList.remove('hidden');
        }
      };

      await pc.setRemoteDescription(new RTCSessionDescription(message.sdp));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.send(JSON.stringify({ type: 'answer', viewerId, sdp: pc.localDescription }));
    }

    connectSignaling();
  </script>
</body>
</html>
