<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photomaton - Récepteur WebRTC (Deuxième Ordinateur)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    #remote-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000000;
      display: block;
    }

    /* Subtle Floating HUD Overlay */
    .hud-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 100;
      opacity: 1;
      transition: opacity 0.8s ease;
    }

    .hud-overlay.faded {
      opacity: 0;
    }

    .hud-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(18, 20, 24, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.5px;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f59e0b; /* Yellow: Connecting */
      box-shadow: 0 0 12px #f59e0b;
      transition: all 0.3s ease;
    }

    .status-dot.connected {
      background: #10b981; /* Green: Live stream */
      box-shadow: 0 0 14px #10b981;
    }

    .status-dot.disconnected {
      background: #ef4444; /* Red: Disconnected */
      box-shadow: 0 0 12px #ef4444;
    }

    .hud-actions {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .hud-btn {
      background: rgba(18, 20, 24, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* Visitor Flash Alert Border */
    .visitor-flash {
      position: absolute;
      inset: 0;
      border: 3px solid #10b981;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 50;
    }

    .visitor-flash.active {
      opacity: 0.85;
      animation: pulseBorder 1.5s ease-out;
    }

    @keyframes pulseBorder {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 0; }
    }

    /* Center Placeholder Message when waiting */
    .waiting-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #08090b;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.6s ease;
    }

    .waiting-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .waiting-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .waiting-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      max-width: 420px;
      line-height: 1.5;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="video-container" id="container">
    <video id="remote-video" autoplay playsinline muted></video>
    <div id="visitor-flash" class="visitor-flash"></div>

    <div class="hud-overlay" id="hud">
      <div class="hud-badge">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Connexion au Photomaton...</span>
      </div>
      <div class="hud-actions">
        <button class="hud-btn" id="btn-fullscreen" title="Basculer Plein Écran (F)">⛶ Plein Écran</button>
      </div>
    </div>

    <div class="waiting-screen" id="waiting-screen">
      <div class="spinner"></div>
      <div class="waiting-title">En attente du flux Photomaton...</div>
      <div class="waiting-subtitle">
        Ce récepteur WebRTC affiche en direct le flux vidéo pur du canvas de la première machine, sans interface.
      </div>
    </div>
  </div>

  <script type="module">
    const videoEl = document.getElementById('remote-video');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const hud = document.getElementById('hud');
    const waitingScreen = document.getElementById('waiting-screen');
    const flashEl = document.getElementById('visitor-flash');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    let pc = null;
    let ws = null;
    let viewerId = 'viewer_' + Math.floor(Math.random() * 100000);
    let hudTimeout = null;

    const iceServers = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ];

    function showHUDTemporarily() {
      hud.classList.remove('faded');
      if (hudTimeout) clearTimeout(hudTimeout);
      hudTimeout = setTimeout(() => {
        if (pc && pc.connectionState === 'connected') {
          hud.classList.add('faded');
        }
      }, 4000);
    }

    document.addEventListener('mousemove', showHUDTemporarily);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      }
    });

    btnFullscreen.addEventListener('click', toggleFullscreen);

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function connectSignaling() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const signalingUrl = `${protocol}//${window.location.host}/webrtc-signaling`;

      statusDot.className = 'status-dot';
      statusText.textContent = 'Connexion au serveur...';

      try {
        ws = new WebSocket(signalingUrl);

        ws.onopen = () => {
          console.log('[WebRTC Receiver] Connecté au serveur de signalement');
          statusText.textContent = 'En attente de l\'ordinateur émetteur...';
          ws.send(JSON.stringify({ type: 'register', role: 'viewer', viewerId }));
        };

        ws.onmessage = async (evt) => {
          try {
            const msg = JSON.parse(evt.data);
            await handleSignalingMessage(msg);
          } catch (err) {
            console.error('[WebRTC Receiver] Erreur message signalement:', err);
          }
        };

        ws.onclose = () => {
          statusDot.className = 'status-dot disconnected';
          statusText.textContent = 'Déconnecté. Nouvelle tentative...';
          waitingScreen.classList.remove('hidden');
          setTimeout(connectSignaling, 2000);
        };

        ws.onerror = (err) => {
          console.warn('[WebRTC Receiver] Erreur WebSocket:', err);
        };
      } catch (e) {
        setTimeout(connectSignaling, 3000);
      }
    }

    async function handleSignalingMessage(msg) {
      if (msg.type === 'offer') {
        console.log('[WebRTC Receiver] Offre WebRTC reçue de l\'émetteur');
        await handleOffer(msg);
      } else if (msg.type === 'ice-candidate') {
        if (pc && msg.candidate) {
          try {
            await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
          } catch (e) {
            console.warn('[WebRTC Receiver] Erreur ICE candidate:', e);
          }
        }
      } else if (msg.type === 'broadcaster-ready') {
        console.log('[WebRTC Receiver] Émetteur prêt');
        statusText.textContent = 'Émetteur détecté. Négociation flux...';
      } else if (msg.type === 'new-visitor-alert') {
        triggerVisitorFlash();
      } else if (msg.type === 'broadcaster-disconnected') {
        statusDot.className = 'status-dot disconnected';
        statusText.textContent = 'Émetteur déconnecté';
        waitingScreen.classList.remove('hidden');
      }
    }

    async function handleOffer(msg) {
      if (pc) {
        try { pc.close(); } catch (e) {}
      }

      pc = new RTCPeerConnection({ iceServers });

      pc.ontrack = (event) => {
        console.log('[WebRTC Receiver] 🎬 Piste vidéo reçue !');
        if (event.streams && event.streams[0]) {
          videoEl.srcObject = event.streams[0];
        } else {
          const inboundStream = new MediaStream();
          inboundStream.addTrack(event.track);
          videoEl.srcObject = inboundStream;
        }

        videoEl.play().catch(() => {});
        waitingScreen.classList.add('hidden');
        statusDot.className = 'status-dot connected';
        statusText.textContent = 'FLUX WEBRTC ACTIF (Plein Écran)';
        showHUDTemporarily();
      };

      pc.ondatachannel = (event) => {
        const dc = event.channel;
        dc.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if (data.type === 'new-visitor') {
              triggerVisitorFlash();
            }
          } catch (err) {}
        };
      };

      pc.onicecandidate = (event) => {
        if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'ice-candidate',
            role: 'viewer',
            viewerId,
            candidate: event.candidate
          }));
        }
      };

      pc.onconnectionstatechange = () => {
        console.log('[WebRTC Receiver] État connexion:', pc.connectionState);
        if (pc.connectionState === 'connected') {
          statusDot.className = 'status-dot connected';
          statusText.textContent = 'FLUX WEBRTC DIRECT // CONNECTÉ';
          waitingScreen.classList.add('hidden');
          showHUDTemporarily();
        } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
          statusDot.className = 'status-dot disconnected';
          statusText.textContent = 'Flux interrompu. En attente...';
          waitingScreen.classList.remove('hidden');
        }
      };

      await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'answer',
          viewerId,
          sdp: pc.localDescription
        }));
      }
    }

    function triggerVisitorFlash() {
      flashEl.classList.remove('active');
      void flashEl.offsetWidth;
      flashEl.classList.add('active');
      statusText.textContent = 'NOUVEAU VISITEUR DÉTECTÉ 👤';
      showHUDTemporarily();
      setTimeout(() => {
        if (pc && pc.connectionState === 'connected') {
          statusText.textContent = 'FLUX WEBRTC DIRECT // CONNECTÉ';
        }
      }, 2500);
    }

    // Start signaling connection
    connectSignaling();
  </script>
</body>
</html>
