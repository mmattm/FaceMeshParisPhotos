<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photomaton - Récepteur WebRTC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .video-container {
      position: relative; width: 100vw; height: 100vh; display: flex;
      align-items: center; justify-content: center; background: #000;
    }
    #remote-video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .hud-overlay {
      position: absolute; top: 20px; left: 20px; right: 20px; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      pointer-events: none; transition: opacity 0.8s ease;
    }
    .hud-overlay.faded { opacity: 0; }
    /* A browser source must never put connection controls into the NDI image. */
    html.obs-output .hud-overlay,
    html.obs-output .waiting-screen { display: none !important; }
    html.obs-output, html.obs-output body { cursor: none; }
    .hud-badge, .hud-btn {
      display: flex; align-items: center; gap: 9px; padding: 8px 14px;
      border: 1px solid rgba(255,255,255,.12); border-radius: 9px;
      background: rgba(18,20,24,.75); backdrop-filter: blur(12px);
      color: #fff; font-size: 12px;
    }
    .hud-btn { pointer-events: auto; cursor: pointer; }
    .hud-btn:hover { background: rgba(255,255,255,.15); }
    .status-dot {
      width: 9px; height: 9px; border-radius: 50%; background: #f59e0b;
      box-shadow: 0 0 12px #f59e0b;
    }
    .status-dot.connected { background: #10b981; box-shadow: 0 0 14px #10b981; }
    .status-dot.disconnected { background: #ef4444; box-shadow: 0 0 12px #ef4444; }
    .waiting-screen {
      position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; background: #08090b;
      transition: opacity .6s ease;
    }
    .waiting-screen.hidden { opacity: 0; pointer-events: none; }
    .waiting-title { font-size: 20px; font-weight: 600; }
    .waiting-subtitle {
      max-width: 430px; color: rgba(255,255,255,.5); font-size: 14px;
      line-height: 1.5; text-align: center;
    }
    .spinner {
      width: 38px; height: 38px; border: 3px solid rgba(255,255,255,.1);
      border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    if (new URLSearchParams(location.search).get('output') === 'obs') {
      document.documentElement.classList.add('obs-output');
    }
  </script>
  <script type="module" crossorigin src="/assets/receiver-DnVgrLcE.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>
<body>
  <div class="video-container">
    <video id="remote-video" autoplay playsinline muted></video>
    <div class="hud-overlay" id="hud">
      <div class="hud-badge">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Connexion au Photomaton…</span>
      </div>
      <button class="hud-btn" id="btn-audio" type="button" aria-pressed="false">🔇 Activer le son</button>
      <button class="hud-btn" id="btn-fullscreen" type="button">⛶ Plein écran</button>
    </div>
    <div class="waiting-screen" id="waiting-screen">
      <div class="spinner"></div>
      <div class="waiting-title">En attente du flux Photomaton…</div>
      <div class="waiting-subtitle">Ce récepteur affiche le flux WebRTC. Activez le son pour entendre les presets. Aucune capture visiteur n’est enregistrée.</div>
    </div>
  </div>

</body>
</html>
